apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

def packageJsonFile = new File(rootProject.projectDir.parentFile, 'package.json')
def packageVersion = '0.0.1'
if (packageJsonFile.exists()) {
    def packageJson = new JsonSlurper().parseText(packageJsonFile.getText('UTF-8'))
    packageVersion = (packageJson.version ?: '0.0.1').toString()
}

def semverParts = packageVersion.tokenize('-')[0].tokenize('.')
def major = semverParts.size() > 0 && semverParts[0].isInteger() ? semverParts[0].toInteger() : 0
def minor = semverParts.size() > 1 && semverParts[1].isInteger() ? semverParts[1].toInteger() : 0
def patch = semverParts.size() > 2 && semverParts[2].isInteger() ? semverParts[2].toInteger() : 0
def packageVersionCode = (major * 10000) + (minor * 100) + patch
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}
def signingStoreFile = findProperty('JOURNALITEA_STORE_FILE') ?: keystoreProperties.getProperty('storeFile')
def signingStorePassword = findProperty('JOURNALITEA_STORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword')
def signingKeyAlias = findProperty('JOURNALITEA_KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias')
def signingKeyPassword = findProperty('JOURNALITEA_KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword')
def hasReleaseSigning = [signingStoreFile, signingStorePassword, signingKeyAlias, signingKeyPassword].every { value -> value }

android {
    namespace = "de.medialesson.journalitea"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.medialesson.journalitea"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode packageVersionCode
        versionName packageVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (!hasReleaseSigning) {
                throw new GradleException('Release builds require complete Journalitea signing credentials.')
            }
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { task -> task.name.toLowerCase().contains('release') } && !hasReleaseSigning) {
        throw new GradleException('Release builds require complete Journalitea signing credentials.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
