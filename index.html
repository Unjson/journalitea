<!doctype html>
<html>

<head>
	<meta charset="utf-8" />
	<title>Electron + Vue</title>
	<link href="/src/style.css" rel="stylesheet">
</head>

<body>
	<div id="app"></div>
	<script type="module">
		import { createApp } from 'vue';

		import router from './src/router.js';

		createApp(App).use(router).mount('#app');
	</script>
</body>

</html>
