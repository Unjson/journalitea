<!doctype html>
<html>

<head>
	<meta charset="utf-8" />
	<title>Electron + Vue</title>
	<link href="/src/style.css" rel="stylesheet">
</head>

<body>
	<div id="app"></div>
	<script type="module">
		import { createApp } from 'vue';
		import App from './src/App.vue';
		import i18n from "./src/services/i18n";
		import router from './src/router.ts';

		createApp(App)
		.use(i18n)
		.use(router)
		.mount('#app');
	</script>
</body>

</html>
